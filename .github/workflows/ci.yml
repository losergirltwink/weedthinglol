name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Read-only token: CI only checks, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned by commit SHA (tag in the comment);
      # Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Rebuild every baked graph and fail if public/graph.*.json differs from
      # what's committed — enforces "never hand-edit graph JSON; run
      # build:graph after data changes".
      - name: Graph drift check
        run: pnpm check:graph

      - name: Build
        run: pnpm build
